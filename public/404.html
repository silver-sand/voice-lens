<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script handles redirects for client-side routing on GitHub Pages
    (function() {
      var redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        window.location.href = redirect;
      } else {
        var pathSegments = window.location.pathname.split('/');
        // Remove the repo name from path if present (e.g., /voice-lens/ -> /)
        var repoName = 'voice-lens';
        var path = window.location.pathname;
        if (pathSegments[1] === repoName) {
          path = '/' + pathSegments.slice(2).join('/');
        }
        path = path.replace(/^\//, '');
        var redirectUrl = '/' + repoName + '/?' + (path ? 'redirect=' + encodeURIComponent(path) : '');
        sessionStorage.setItem('redirect', redirectUrl);
        window.location.href = redirectUrl;
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to Voice Lens...</p>
</body>
</html>
